name: Publish GitHub Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.1.0 or v0.1.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-packages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || [[ "$RELEASE_TAG" == *-SNAPSHOT ]]; then
            echo 'Use a release tag such as v0.1.0 or v0.1.0-rc.1; SNAPSHOT tags are not published.' >&2
            exit 1
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify SDK
        env:
          SDK_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          ./gradlew :core:jvmTest :sample-android:assembleDebug :sample-android:lintDebug
          -PsdkVersion="$SDK_VERSION" --no-daemon --console=plain
      - name: Publish SDK modules
        env:
          SDK_VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishGitHubPackages -PsdkVersion="$SDK_VERSION" --no-daemon --console=plain
